# -----------------------------------------------------------------------------
# 6. IGSN → MATERIAL MAPPING
#    Resolves a trace's material from its Sample_IGSN (or, failing that, the
#    IGSN prefix of its filename): the IGSN is matched against the keys below
#    and the mapped material name is then looked up in material_properties.
#
#    Keys may be full IGSNs (JHAMAL00016-004) or parent-IGSN prefixes
#    (JHAMAL00016, which matches every child like JHAMAL00016-004,
#    JHAMAL00016-005, …). The longest matching key wins, so a full-IGSN entry
#    overrides its parent prefix. Matching is case-insensitive.
#
#    This mapping takes priority over the 'Sample material' column in the
#    parameter file — the parameter file's value is only used as a fallback
#    when the trace's IGSN has no match here.
# -----------------------------------------------------------------------------
igsn_material_map:

  # All JHAMAL00016 children (JHAMAL00016-004, -005, …) are CP-Titanium.
  JHAMAL00016: Ti
