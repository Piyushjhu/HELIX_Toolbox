# FROZEN control config for the regression trace (C1--20251022--00001, Brass).
# Snapshot of helix_master_config.yml + SPADE-only overrides. Kept fixed so the
# control isolates CODE changes; @DATA@/@PARAMS@/@OUTPUT@ are resolved at run time.
cli_settings:
  input_dir: '@DATA@'
  input_files: null
  input_pattern: '*.csv'
  output_dir: '@OUTPUT@'
  param_folder: '@PARAMS@'
  analysis_mode: spade_only
  spade_mode: manual
  spade_input_files: null
  spade_input_dir: '@DATA@'
  spade_input_pattern: '*--vel-smooth-with-uncert.csv'
alpss_config:
  save_data: 'yes'
  display_plots: 'no'
  save_all_plots: 'no'
  spall_calculation: 'no'
  header_lines: 22
  start_time_user: none
  start_time_correction: 0
  time_to_skip: 0.0
  time_to_take: 6.0e-06
  t_before: 2.0e-08
  t_after: 2.0e-07
  iq_threshold_factor: 0.8
  freq_min: 1200000000.0
  freq_max: 3300000000.0
  sample_rate: 128000000000.0
  nperseg: 512
  noverlap: 400
  nfft: 2560
  window: hann
  blur_kernel_x: 3
  blur_kernel_y: 3
  blur_sigx: 0.0
  blur_sigy: 0.0
  carrier_band_time: 2.5e-07
  smoothing_type: savgol
  smoothing_window_ns: 10
  smoothing_window: null
  smoothing_wid: 3.0
  smoothing_amp: 1.0
  smoothing_sigma: 1.0
  smoothing_mu: 0.0
  savgol_polyorder: 3
  pb_neighbors: 400
  pb_idx_correction: 0
  rc_neighbors: 400
  rc_idx_correction: 0
  use_notch_filter: false
  order: 6
  wid: 1500000000.0
  uncert_mult: 10.0
  C0: 3950.0
  density: 8960.0
  lam: 1.55e-06
  theta: 0.0
  delta_rho: 9.0
  delta_C0: 23.0
  delta_lam: 8.0e-18
  delta_theta: 5.0
  cmap: viridis
  save_velocity_csv: false
  save_velocity_smooth_csv: true
  save_velocity_uncert_csv: false
  save_velocity_smooth_uncert_csv: true
  save_results_csv: true
  save_noise_csv: true
  save_combined_plot: true
  save_iq_start_time_plot: false
spade_config:
  experiment_velocity_shots: true
  experiment_spall_analysis: true
  experiment_hel_detection: true
  spall_start_time_ns: 0.0
  spall_end_time_ns: 100.0
  threshold_velocity_ms: 5.0
  align_velocity_threshold_ms: 10.0
  spall_smoothing_sigma_ns: 1.5
  prominence_factor: 0.01
  peak_distance_ns: 3.0
  min_recomp_ratio: 0.025
  min_recomp_velocity_ratio: 1.025
  min_recomp_time_ns: 3
  hel_start_time_ns: 0
  hel_end_time_ns: 15
  minimum_HEL_velocity_expected: 10.0
  hel_detection_min_points: 10
  hel_rdp_epsilon: 1.25
  hel_slope_drop_ratio: 0.9
  hel_min_plateau_duration: 0.5
  hel_angle_threshold_deg: 86.0
  hel_t0_method: signal_start
  use_hel_t0_alignment_for_plots: true
  mad_filter_enabled: true
  mad_filter_threshold: 3.0
  uncertainty_threshold_ms: 10.0
  plot_individual: true
  save_summary: true
  show_plots: false
  x_min_main: 0.0
  x_max_main: 120.0
  y_min_main: 0.0
  y_max_main: 400.0
  x_min_zoom: 0.0
  x_max_zoom: 100.0
  y_min_zoom: 0.0
  y_max_zoom: 300.0
  auto_calculate_limits: false
  zoom_window_ns: 80
  generate_all_velocity_plot: true
  include_uncert_bands: true
  uncert_alpha: 0.3
  skip_unknown_material_traces: true
  signal_length: Full Signal (None)
post_processing_config:
  enabled: false
  spade_output_dir: '@OUTPUT@/SPADE_analysis'
  plots:
    hel_vs_peak_velocity: true
    hel_vs_hel_strain_rate: true
    hel_vs_laser_energy: false
    flyer_row_column_peak_velocity_heatmap: false
    flyer_row_column_pair_peak_velocity: false
    flyer_row_column_pair_peak_velocity_by_material: false
    peak_velocity_pattern_analysis: false
    shock_stress_vs_laser_energy: false
    shock_stress_vs_waveplate_angle: false
    shock_stress_vs_peak_velocity: false
    row_column_vs_peak_shock_stress: false
    laser_energy_vs_waveplate_angle: false
